<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Cálculos de Densidades</title>
  <link rel="icon" href="10109817.png?v=0.2" type="image/ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to bottom right, #014f6e, #028f74);
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
        height: 55px; background-color: rgba(0, 43, 69, 0.9);
        backdrop-filter: blur(10px); display: flex; align-items: center;
        padding: 0 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); box-sizing: border-box;
    }

    .header-title { font-size: 1.05rem; font-weight: bold; text-align: center; flex-grow: 1; }

    main {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 75px 10px 40px 10px; gap: 20px; box-sizing: border-box;
    }

    .quadro-identico {
        width: 100%; max-width: 95vw; padding: 15px; border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        text-align: center; box-sizing: border-box;
    }

    .select-custom, .custom-input {
        width: 100%; max-width: 400px; height: 45px; margin: 5px 0; border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.2); background-color: rgba(0, 50, 60, 0.4);
        color: white; font-size: 0.95rem; text-align: center; outline: none; box-sizing: border-box;
    }

    .resultado-erro { color: #ff7043 !important; } 
    .alerta-densidade { 
        color: #ff7043; 
        font-weight: bold; 
        font-size: 0.85rem; 
        margin: 12px 0; 
        display: none;
        line-height: 1.4;
    }
    .alerta-titulo { font-size: 1.1rem; letter-spacing: 1px; }

    .aviso-texto { font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); margin-top: 5px; font-style: italic; }

    /* --- CORREÇÃO DA TABELA --- */
    .tabela-container { 
        max-height: 250px; 
        overflow: auto; 
        border-radius: 8px; 
        background-color: rgba(0,0,0,0.4); 
        border: 1px solid rgba(255,255,255,0.1);
    }

    table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.7rem; }

    /* 1. Fixar a linha do topo (Densidades) */
    thead th { 
        position: sticky; 
        top: 0; 
        z-index: 10; 
        background-color: #01415a; 
        color: #4db6ac; 
        padding: 8px 4px;
        border-bottom: 2px solid rgba(0,0,0,0.3);
    }

    /* 2. Fixar a primeira coluna (Materiais) */
    tbody td:first-child { 
        position: sticky; 
        left: 0; 
        z-index: 5; 
        background-color: #012b3d; 
        color: white; 
        text-align: left; 
        min-width: 120px; 
        padding: 8px 10px;
        border-right: 2px solid rgba(0,0,0,0.3);
    }

    /* 3. A CÉLULA MESTRA (Material / Ref) - Fixa em ambos os eixos */
    thead th:first-child { 
        position: sticky; 
        top: 0; 
        left: 0; 
        z-index: 20; /* Valor mais alto para ficar acima de tudo */
        background-color: #012b3d; 
        color: #4db6ac;
        border-right: 2px solid rgba(0,0,0,0.3);
        border-bottom: 2px solid rgba(0,0,0,0.3);
    }

    td, th { border: 0.5px solid rgba(255,255,255,0.05); text-align: center; padding: 6px 4px; }
    .marca-x { color: #4db6ac; font-weight: bold; font-size: 0.9rem; }

    footer { position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(0, 43, 69, 0.9); text-align: center; padding: 5px 0; font-size: 0.75rem; }
  </style>
</head>
<body>

<header>
    <div class="header-title">Cálculos de Densidades</div>
</header>

<main>
    <div class="quadro-identico" style="max-width: 450px;">
        <select id="select-molde" class="select-custom" onchange="verificarSelecao()">
            <option value="">Selecione o modelo do balde</option>
        </select>

        <select id="select-material" class="select-custom" onchange="verificarSelecao()">
            <option value="">Selecione o material</option>
        </select>
        
        <input type="number" id="input-densidade" class="custom-input" 
               placeholder="Escreva a Densidade (ex: 0.923)" step="0.001" 
               disabled oninput="executarCalculo()">
        
        <div id="res-area" style="margin-top:10px; opacity:0; transition:0.3s;">
            Peso Estimado: <span id="resultado" style="color:#4db6ac; font-weight:bold; font-size:1.4rem;">---</span> g
            
            <div id="msg-alerta" class="alerta-densidade">
                <span class="alerta-titulo">ATENÇÃO!</span><br>
                Densidade fora dos valores de referência.
            </div>
            
            <div class="aviso-texto">
                Os valores de peso obtidos são apenas valores de referência. Poderá haver casos em que não será aplicável.
            </div>
        </div>
    </div>

    <div class="quadro-identico">
        <h3 style="font-size: 0.7rem; margin-top: 0; color: #4db6ac;">DENSIDADES DE REFERÊNCIA</h3>
        <div class="tabela-container">
            <table>
                <thead>
                    <tr id="header-densidades">
                        <th>Material / Ref</th>
                        </tr>
                </thead>
                <tbody id="corpo-matriz"></tbody>
            </table>
        </div>
    </div>
</main>

<footer id="rodape"></footer>

<script>
    const colunasDensidade = [0.89, 0.90, 0.91, 0.92, 0.93, 0.94, 0.95, 0.96, 0.97];
    const listaMateriais = [
    { nome: "MGG C4200 90/04", ref: "MPPX0087", ok: [0.91, 0.92, 0.93] },
    { nome: "MGG C4200 90/04", ref: "MPPD25006", ok: [0.91, 0.92, 0.93] },
    { nome: "MGG B4200 70/31", ref: "MPPF25001", ok: [0.92, 0.93] },
    { nome: "MGG B4200 70/35", ref: "MPPX24002", ok: [0.91, 0.92, 0.93] },
    { nome: "MGG B4200 70/35", ref: "MPPD26001", ok: [0.91, 0.92, 0.93] },
    { nome: "Veolia G40 Grey", ref: "MPPX0111", ok: [0.93, 0.94, 0.95, 0.96, 0.97] },
    { nome: "Veolia G25 GREY MFI 25", ref: "MPPX24003", ok: [0.93, 0.94, 0.95, 0.96, 0.97] },
    { nome: "BAGE R300925", ref: "MPPX23004", ok: [0.93, 0.94] },
    { nome: "ESLAPRENE 3310300", ref: "MPPZ25002", ok: [0.91, 0.92] },
    { nome: "ESLAPRENE 3310200", ref: "MPPZ26003", ok: [0.90, 0.91] },
    { nome: "RDC PPOC CINZA", ref: "MPPD25001", ok: [0.91, 0.92, 0.93, 0.94] },
    { nome: "Mafill CR 6041", ref: "MPPW0113", ok: [0.89, 0.90] },
    { nome: "PPON NAT", ref: "MPPR26001", ok: [0.89, 0.90] }
];

    const listaMoldes = [
        { nome: "Balde 0,5Kg", vol: 20.6 },
        { nome: "Balde 0,5Lt M2000", vol: 42.32 },
        { nome: "Balde 0,75Lt M2000", vol: 47.06 },
        { nome: "Balde 1Lt M2000", vol: 53.68 },
        { nome: "Balde 2,5Lt", vol: 137.76 },
        { nome: "Balde 4Lt M0301", vol: 172.93 },
        { nome: "Balde 5Lt M0301", vol: 222.75 },
        { nome: "Balde 12,5Lt M03", vol: 627.9 },
        { nome: "Balde 12,5Lt M22", vol: 552.52 },
        { nome: "Balde 15Lt M2000", vol: 608.1 },
        { nome: "Balde 15Lt M2001", vol: 613.1 },
        { nome: "Balde 15Lt M0302 Light", vol: 624.58 },
        { nome: "Balde 15Lt M0304", vol: 697.16 },
        { nome: "Balde 15Lt M22", vol: 560.4 },
        { nome: "Balde 15Lt M24", vol: 657.4 },
        { nome: "Balde 18Lt M03", vol: 734.2 },
        { nome: "Balde 20Lt M03", vol: 797.89 }
    ];

    function init() {
        const hRow = document.getElementById('header-densidades');
        colunasDensidade.forEach(d => {
            const th = document.createElement('th');
            th.textContent = d.toFixed(2);
            hRow.appendChild(th);
        });

        const corpo = document.getElementById('corpo-matriz');
        listaMateriais.forEach((m, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${m.nome}<br><span style="font-size:0.55rem; opacity:0.6">${m.ref}</span></td>`;
            colunasDensidade.forEach(d => {
                const td = document.createElement('td');
                if (m.ok.includes(d)) td.innerHTML = '<span class="marca-x">X</span>';
                tr.appendChild(td);
            });
            corpo.appendChild(tr);

            const optMat = document.createElement('option');
            optMat.value = index; 
            optMat.textContent = m.nome + " (" + m.ref + ")";
            document.getElementById('select-material').appendChild(optMat);
        });

        const selMolde = document.getElementById('select-molde');
        listaMoldes.forEach(mo => {
            const opt = document.createElement('option');
            opt.value = mo.vol; opt.textContent = mo.nome;
            selMolde.appendChild(opt);
        });

        relogio();
        setInterval(relogio, 1000);
    }

    function verificarSelecao() {
        const mld = document.getElementById('select-molde').value;
        const mat = document.getElementById('select-material').value;
        const inp = document.getElementById('input-densidade');
        inp.disabled = (mld === "" || mat === "");
        if (!inp.disabled) executarCalculo(); 
    }

    function executarCalculo() {
        const vol = parseFloat(document.getElementById('select-molde').value);
        const matIdx = document.getElementById('select-material').value;
        const d_text = document.getElementById('input-densidade').value;
        const resArea = document.getElementById('res-area');
        const resSpan = document.getElementById('resultado');
        const msgAlerta = document.getElementById('msg-alerta');
        
        const partes = d_text.split('.');
        const temTresDecimais = partes.length === 2 && partes[1].length >= 3;

        if (!vol || matIdx === "" || d_text === "" || !temTresDecimais) {
            resArea.style.opacity = "0";
            return;
        }

        const densidadeFull = parseFloat(d_text);
        const densidadeComparar = parseFloat(densidadeFull.toFixed(2)); 
        
        resSpan.innerText = (vol * densidadeFull).toFixed(1);
        resArea.style.opacity = "1";

        const materialObj = listaMateriais[matIdx];
        if (materialObj.ok.includes(densidadeComparar)) {
            resSpan.classList.remove('resultado-erro');
            msgAlerta.style.display = "none";
        } else {
            resSpan.classList.add('resultado-erro');
            msgAlerta.style.display = "block";
        }
    }

    function relogio() {
        const n = new Date();
        document.getElementById("rodape").textContent = n.toLocaleDateString("pt-PT") + " " + n.toLocaleTimeString("pt-PT", {hour:'2-digit', minute:'2-digit'});
    }

    window.onload = init;
</script>
</body>
</html>
